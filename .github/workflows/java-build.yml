name: Java build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, docs/core-enums-control-146, docs/core-syntax-operators-154, docs/core-assert-optional-162, docs/core-annotations-reflection-170, docs/core-modules-classloader-177, docs/core-numbers-datetime-186, docs/core-regex-utilities-195, docs/core-i18n-serial-203, author/col-contracts-hash-c1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run build and JUnit tests
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Run standalone Java Core example (source-file mode)
        run: |
          java examples/core/ValuesAndReferencesDemo.java
          java examples/core/TypesAndVariablesDemo.java
          java examples/core/ConversionsDemo.java
          java examples/core/ParametersDemo.java
          java examples/core/ClassesAndObjectsDemo.java

      - name: Compile and run CORE-ACCESS positive and negative cases
        run: bash examples/core/access/verify.sh

      - name: Verify CORE-INHERITANCE positive and negative cases
        run: bash examples/core/inheritance/verify.sh

      - name: Verify CORE-INIT initialization order example
        run: bash examples/core/initialization/verify.sh

      - name: Verify CORE-EQUALITY positive and contract-breaking cases
        run: bash examples/core/equality/verify.sh

      - name: Verify CORE-INTERFACES + CORE-COMPOSITION runnable
        run: bash examples/core/interfaces-composition/verify.sh

      - name: Verify CORE-NESTED + CORE-FUNCTIONS runnable
        run: bash examples/core/nested-functions/verify.sh

      - name: Verify CORE-GENERICS + CORE-ERASURE runnable
        run: bash examples/core/generics-erasure/verify.sh

      - name: Verify CORE-EXCEPTIONS + CORE-RESOURCES runnable
        run: bash examples/core/exceptions-resources/verify.sh

      - name: Verify CORE-STREAMS + CORE-STREAM-ADV runnable
        run: bash examples/core/streams/verify.sh

      - name: Verify CORE-ARRAYS + CORE-STRINGS/BUILDERS runnable
        run: bash examples/core/arrays-strings/verify.sh

      - name: Verify CORE-RECORDS + CORE-IMMUTABLE runnable
        run: bash examples/core/records-immutability/verify.sh

      - name: Verify CORE-SEALED + CORE-PATTERNS Java 21 runnable
        run: bash examples/core/sealed-patterns/verify.sh

      - name: Verify CORE-ENUMS + CORE-CONTROL Java 21 runnable
        run: bash examples/core/enums-control/verify.sh

      - name: Verify CORE-SYNTAX + CORE-OPERATORS Java 21 runnable
        run: bash examples/core/syntax-operators/verify.sh

      - name: Verify CORE-ASSERT + CORE-OPTIONAL Java 21 runnable
        run: bash examples/core/assert-optional/verify.sh

      - name: Verify CORE-ANNOTATIONS + CORE-REFLECTION Java 21 and JPMS runnable
        run: bash examples/core/annotations-reflection/verify.sh

      - name: Verify CORE-MODULES + CORE-CLASSLOADER Java 21 and JPMS runnable
        run: bash examples/core/modules-classloader/verify.sh

      - name: Verify CORE-NUMBERS + CORE-DATETIME Java 21 runnable
        run: bash examples/core/numbers-datetime/verify.sh

      - name: Verify CORE-REGEX + CORE-UTIL Java 21 runnable
        run: bash examples/core/regex-util/verify.sh

      - name: Verify CORE-I18N + CORE-SERIAL Java 21 trusted-only runnable
        run: bash examples/core/i18n-serialization/verify.sh

      - name: Verify COL-CONTRACTS + COL-HASH Java 21 runnable
        run: bash examples/collections/contracts-hash/verify.sh

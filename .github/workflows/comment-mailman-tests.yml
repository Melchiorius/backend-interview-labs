name: GitHub comment mailman tests

on:
  pull_request:
    paths:
      - "tools/comment_mailman.py"
      - "tools/tests/test_comment_mailman.py"
      - ".github/workflows/comment-mailman-tests.yml"
  push:
    paths:
      - "tools/comment_mailman.py"
      - "tools/tests/test_comment_mailman.py"
      - ".github/workflows/comment-mailman-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tools/tests -p "test_comment_mailman.py" -v

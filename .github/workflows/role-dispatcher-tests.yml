name: Role dispatcher unit tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/role_dispatcher.py'
      - 'tools/tests/**'
      - '.github/workflows/role-dispatcher-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/role_dispatcher.py'
      - 'tools/tests/**'
      - '.github/workflows/role-dispatcher-tests.yml'
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline role dispatcher unit tests
        run: python -m unittest discover -s tools/tests -v

name: Semaphore pilot reference tests

on:
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'exercises/concurrency/semaphore-limited-service/**'
      - '.github/workflows/semaphore-pilot.yml'
  workflow_dispatch:

jobs:
  reference-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm included build
        run: ./gradlew projects
      - name: Show source sets
        run: ./gradlew -p exercises/concurrency/semaphore-limited-service sourceSets
      - name: Test reference implementation in isolation
        run: ./gradlew -p exercises/concurrency/semaphore-limited-service test -Preference=true
